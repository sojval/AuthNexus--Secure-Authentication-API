spring.application.name=Auth
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/authsystem
spring.datasource.username=root
spring.datasource.password=root
# Secret key used to sign the JWTs.
# Note: Should be a Base64-encoded string of at least 256 bits (32 bytes) for HS256.
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Token expiration time in milliseconds (e.g., 86400000 ms = 24 hours)
jwt.expiration-ms=86400000

# Optional: Refresh token expiration time in milliseconds (e.g., 604800000 ms = 7 days)
jwt.refresh-expiration-ms=604800000

# Optional: Issuer claim (iss)
jwt.issuer=my-spring-app


# Refresh token cookie settings
app.cookie.refresh-token-name=refresh_token
app.cookie.refresh-token-http-only=true
app.cookie.refresh-token-secure=false
app.cookie.refresh-token-same-site=Lax
app.cookie.refresh-token-path=/api/auth
app.cookie.refresh-token-max-age=604800
app.cookie.refresh-token-domain=localhost


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile,openid